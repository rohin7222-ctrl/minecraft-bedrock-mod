name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy APK
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/ \;
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Ben10-Mod-APK
          path: apk_output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Minecraft Bedrock Ben 10 Mod APK v1.0.${{ github.run_number }} (HD Visual & UI Overhaul)
          body: |
            ## 🟢 Minecraft Bedrock Mod (Ben 10 Edition) - Masterpiece HD Overhaul!
            - **32x32 HD Item Art**: Crisp, high-definition shaded textures for all 9 Omnitrix watches, Holographic Activator, Detransform Emergency Badge, and 76 Alien Species Emblems!
            - **Series-Accurate 3D Omnitrix Wristbands**: Sleek customized wrist cuffs on player's left arm with 3D octagonal bezels, corner rivets, side pop-up buttons, and glowing cores!
            - **Alien Visual Overhaul**: Completely eliminated checkerboard noise! Replaced with authentic muscle shading, carapace armor plating, species contours, and chest Omnitrix badges!
            - **Interactive In-Game UI**: High-tech ActionFormData Omnitrix Dial UI, Titanium HUD status capsule with digital energy bars, and dynamic actionbar indicators!
            - **Classic Omnitrix Timer Lock**: Actionbar countdown timer; manual detransformation locked (Prototype Error) and auto-reverts at 0s!
            - **Modern Omnitrixes Manual Revert**: Dedicated hotbar button & Sneak+Tap chest dial ability to return to human form anytime!
            - **Biomnitrix 2-Alien Fusion Engine & Master Control Mode**!
            - **Auto-Bypass Android Scoped Storage (1-Click Import into Minecraft)**!
            
            ### 📥 Direct APK Download:
            Download the `app-debug.apk` file below and tap Install!
          files: apk_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
