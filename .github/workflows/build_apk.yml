name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy APK and MCADDON
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/ \;
          cp app/src/main/assets/*.mcaddon apk_output/ 2>/dev/null || true
          cp app/src/main/assets/*.mcpack apk_output/ 2>/dev/null || true
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Ben10-Mod-APK
          path: |
            apk_output/*.apk
            apk_output/*.mcaddon
            apk_output/*.mcpack
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Minecraft Bedrock Mod Hub v1.0.${{ github.run_number }} (Green Lantern & Pro Suite v1.0.89)
          body: |
            ## 🟢 Minecraft Bedrock Mod Hub v1.0.${{ github.run_number }} (Green Lantern Corps Edition & Pro Suite v1.0.89)
            Added Green Lantern 3.9.1 Addon with all 7 Lantern Corps, 21 Split Suits, and Ring Constructs! Removed old vehicle mods as requested. Features persistent favorites bookmarking, in-depth mod guide sheets, system diagnostics hub, tactile haptic feedback, 4-Way dynamic sorting, and 14 epic Bedrock addons with 1-Tap direct Minecraft auto-launching!
            
            ### 🌟 v1.0.89 Upgrade Highlights:
            - **🟢 Green Lantern 3.9.1 Masterpiece**: 7 Lantern Corps (Willpower Green, Sinestro Yellow, Red Rage, Blue Hope, Indigo, Orange, Star Sapphire Pink, White Life, Black Death), Power Batteries, 21 Split Suits, Ring Builder with 6 Blueprints, Custom Energy Constructs, Supersonic Ring Flight, and Oa Quests!
            - **⭐ Persistent Favorites & Starred Filter**: Star your favorite mods and filter them with one tap (`⭐ Starred`).
            - **📖 In-Depth Mod Guide & Details Sheet**: Tap '📖 Guide' or any mod card for in-depth lore, spawn eggs, and in-game chat commands.
            - **⚙️ Bedrock System & Diagnostics Hub**: Tap the top status bar for live device telemetry, free storage space (GB), and 60 FPS performance monitoring.
            - **⚡ 4-Way Dynamic Sorting**: Toggle between Featured, Alphabetical (A-Z), File Size (Smallest First), and Starred First.
            - **📳 Tactile Haptic Feedback**: Native vibration feedback on button presses and star toggles.
            
            ### 🏛️ 14 Legendary Bedrock Mods Included:
            1. **🏛️ Civilization: Autonomous AI Villagers (v1.0.86 Masterpiece)**
               - 100% Real Player AI Villagers with 4 Faith Religions, Sacred Altars, full Netherite/Diamond Armor, dynamic Redstone/Piston automation, Anti-Zombie Sanctuary spawn proofing, and distinct personality characteristics!
            2. **💎 UltraReal 100x HD Realistic Textures (v2.0)**
               - Ultra-realistic 100x high-definition textures with PBR lighting reflections, realistic skies, crystal waters, and 60 FPS mobile optimization.
            3. **🟢 Green Lantern: Corps Universe (v3.9.1 Masterpiece Addon)**
               - 7 Lantern Corps, Power Batteries, 21 Split Suits, Ring Builder, Energy Constructs (Shields, Fists, Swords, Cannons), Supersonic Ring Flight, and Oa Missions!
            4. **🧬 Ben 10: Omni Evolution (Beta Addon)**
               - Custom evolution dimension, Vilgax boss animations, custom combat controllers, and alien transformations.
            5. **🛸 Omni-Bound: Faster Switching (v1.5.2)**
               - Instant quick-dial switching, 50+ alien forms, ultimate evolutions, and cinematic sound FX.
            6. **🗡️ Solo Leveling (v1.0.6 System Awakening)**
               - Sung Jinwoo's Hunter System, daily stat quests, Dagger combat, Red Gate dungeons, and Arise Shadow Soldier extraction!
            7. **🏴‍☠️ One Piece: Bedrock Edition (v76.0.0)**
               - Grand Line anime adventure! Devil Fruits, Haki mastery, Marine & Pirate factions, custom katanas (Yoru, Enma), and bosses!
            8. **🔮 Tensura: Reincarnated Requiem (v4 / 26.52)**
               - That Time I Got Reincarnated as a Slime! Great Sage mental HUD overlay, Predator skill mimicry, magicules system, Direwolves, Goblins, Charybdis and Demon Lord abilities!
            9. **🐉 Dragon Evolution (v1.5.0)**
               - Massive Dragon Evolution experience! Transform into Super Saiyan, unleash Kamehameha & Final Flash ki attacks, custom dimensions, and anime bosses!
            10. **🔫 Actual Guns 2: 3D Tactical**
                - Ultra-detailed 3D firearms! Custom recoil, first-person reload animations, sniper scopes, shotguns, assault rifles, and tactical combat!
            11. **⚡ Quirkborn: My Hero Academia (v1.515)**
                - Awaken your Quirk! One For All, Explosion, Decay, Overhaul, Half-Cold Half-Hot, fight Nomus, craft hero/villain gear, and unlock super moves!
            12. **🤖 Iron Man: Armor Wars Addon**
                - Mark 1 through 85 suits, supersonic flight, repulsors, micro-missiles, unibeam, and JARVIS HUD!
            13. **🕷️ Spider-Man: Web of Shadows Addon**
                - Fluid web slinging, wall climbing, Spider-Sense, 20+ movie suits (Symbiote, Iron Spider), and classic villain fights!
            14. **⭐ Marvel Project: Avengers Assemble (v3.0.1)**
                - Summon Mjolnir lightning, throw Cap's vibranium shield, Wolverine adamantium claws, Doctor Strange mystic portals, and the Infinity Gauntlet!
            
            ### 📥 Direct Downloads:
            - **Android Multi-Mod Installer App**: Download `app-debug.apk` and tap Install!
            - **Direct Green Lantern Addon**: Download `Green_Lantern_3_9_1.mcaddon` (Auto-opens in Minecraft!)
            - **Direct Civilization Addon**: Download `Civilization.mcaddon` (Auto-opens in Minecraft!)
            - **Direct UltraReal 100x HD Texture Pack**: Download `UltraReal_100x_HD_v2.mcpack` (Auto-opens in Minecraft!)
            - **Direct Omni Evolution Addon**: Download `Omni-Evolution-Beta.mcaddon`
            - **Direct Omni Bound Addon**: Download `Omni_Bound_v1.5.2.mcaddon`
            - **Direct Solo Leveling Addon**: Download `Solo_Leveling_v1.0.6.mcaddon`
            - **Direct One Piece Addon**: Download `OnePiece_Bedrock_Edition_v76.mcaddon`
            - **Direct Tensura Requiem Addon**: Download `Tensura_Reincarnated_Requiem_v4.mcaddon`
            - **Direct Dragon Evolution Addon**: Download `Dragon_Evolution_v1.5.0.mcaddon`
            - **Direct Actual Guns 2 Addon**: Download `Actual_Guns_2.mcaddon`
            - **Direct Quirkborn Addon**: Download `Quirkborn_v1.515.3.mcaddon`
            - **Direct Iron Man Addon**: Download `Iron_Man_Addon.mcaddon`
            - **Direct Spider-Man Addon**: Download `Spider_Man_Addon.mcaddon`
            - **Direct Marvel Project Addon**: Download `Marvel_Project_v3.0.1.mcaddon`
          files: |
            apk_output/*.apk
            apk_output/*.mcaddon
            apk_output/*.mcpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
