name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy APK and MCADDON
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/ \;
          cp app/src/main/assets/*.mcaddon apk_output/
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Ben10-Mod-APK
          path: |
            apk_output/*.apk
            apk_output/*.mcaddon
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Minecraft Bedrock Mod Hub v1.0.${{ github.run_number }} (Ben 10 + Omni Evolution + One Piece)
          body: |
            ## 🟢 Minecraft Bedrock Mod Hub (Multi-Mod 1-Click Installer)
            Now includes 3 epic Bedrock Addons with 1-Click direct Minecraft launching:
            
            1. **⚡ Ben 10: Omnitrix Origins (HD Ultimate)**
               - 9 Legendary 3D Omnitrixes, 76 Sculpted Aliens, Kevin Car (30x58), Rust Bucket RV (38x88), Galvan OS Playlists.
            2. **🧬 Ben 10: Omni Evolution (Beta Addon)**
               - Custom evolution dimension, Vilgax boss animations, custom combat controllers, and extra alien variants.
            3. **🏴‍☠️ One Piece: Bedrock Edition (v76.0.0)**
               - Grand Line anime adventure! Devil Fruits, Haki mastery, Marine & Pirate factions, custom katanas (Yoru, Enma), and bosses!
            
            ### 📥 Direct Downloads:
            - **Android Multi-Mod Installer App**: Download `app-debug.apk` and tap Install!
            - **Direct Ben 10 Origins Addon**: Download `Ben10_Bedrock_Mobile_Edition.mcaddon`
            - **Direct Omni Evolution Addon**: Download `Omni-Evolution-Beta.mcaddon`
            - **Direct One Piece Addon**: Download `OnePiece_Bedrock_Edition_v76.mcaddon`
          files: |
            apk_output/*.apk
            apk_output/*.mcaddon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
