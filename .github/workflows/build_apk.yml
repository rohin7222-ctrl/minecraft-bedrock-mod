name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy APK and MCADDON
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/ \;
          cp app/src/main/assets/*.mcaddon apk_output/ 2>/dev/null || true
          cp app/src/main/assets/*.mcpack apk_output/ 2>/dev/null || true
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Ben10-Mod-APK
          path: |
            apk_output/*.apk
            apk_output/*.mcaddon
            apk_output/*.mcpack
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Minecraft Bedrock Mod Hub v1.0.${{ github.run_number }} (S.H.A.D.O.W. AI Drone Advanced Combat & Revive Edition v1.0.95)
          body: |
            ## 🤖 Minecraft Bedrock Mod Hub v1.0.${{ github.run_number }} (S.H.A.D.O.W. AI Drone Advanced Combat & Revive Edition v1.0.95)
            Major AI Drone behavioral enhancement! Introduces full Bedrock collision physics, Chirp taming to activate hover/flying, autonomous laser combat targeting hostile mobs (Zombies, Skeletons, Creepers) within 15 blocks, Sit/Stand power controls, full visible boss health bar, and immortal downed-state revive mechanics!
            
            ### 🤖 What's New in v1.0.95:
            - **🛡️ Collision Physics & Grounded Rest**: Equipped with `minecraft:collision_box` to prevent block-phasing; rests peacefully on the ground upon spawning.
            - **🎵 Chirp Taming & Hover Propulsion**: Tame the wild drone using 'Chirp' (`minecraft:music_disc_chirp`) to activate `minecraft:movement.hover`, `flying_speed`, and `follow_owner` navigation!
            - **💥 Autonomous Laser Combat Cannon**: Attacks hostile monsters (Zombies, Skeletons, Creepers) within a 15-block radius of its owner using high-speed laser projectiles (`shadow:laser_bullet`)!
            - **🔋 Sit / Stand Power Controls**: Owner can tap/interact with the drone to Power Down (Sit/land on ground, stop moving) or Power Up (Stand/float and protect)!
            - **❤️ Visible Health Bar & Downed State**: Displays an on-screen boss health bar. Upon taking fatal damage, the drone does NOT die; it drops to the ground in a 'downed' inactive state!
            - **⚡ Chirp Reboot & Revive System**: Interacting with a downed drone using 'Chirp' reboots and restores it to full 50 HP floating combat readiness!
            - **🚁 Craftable S.H.A.D.O.W AI Drone & Chirp Disc**: Full survival crafting recipes for both the drone and Chirp music disc!
            - **🔵 Full Blue Screen Server-UI Onboarding**: Professor Rohin's Welcome Form -> Player Name Modal -> Seamless Screen Disappearance & Chat Broadcast!
            - **📦 Complete .mcaddon Unified Archive**: Installs both Behavior Pack and Resource Pack in 1-Click!
            
            ### 🔮 15 Legendary Bedrock Mods Included:
            1. **🤖 Minecraft AI Edition (S.H.A.D.O.W. UI & Resource Pack)**
               - Futuristic cyberpunk loading screen UI, custom high-resolution 'Minecraft AI Edition' title logo, animated glowing cyan progress matrix, and cybernetic AI companion theme!
            2. **🔮 MYTHOS: Ascension (v7.16.0 Masterpiece RPG Addon)**
               - 6 Ascendant Classes, dynamic Mana & Spell-casting, Omega Fortress Dungeons, Mythic World Bosses, Aegis Artifact Armor, and 60 FPS mobile performance!
            3. **💎 UltraReal 100x HD Realistic Textures (v2.0)**
               - Ultra-realistic 100x high-definition textures with PBR lighting reflections, realistic skies, crystal waters, and 60 FPS mobile optimization.
            4. **🟢 Green Lantern: Corps Universe (v3.9.1 Masterpiece Addon)**
               - 7 Lantern Corps, Power Batteries, 21 Split Suits, Ring Builder, Energy Constructs (Shields, Fists, Swords, Cannons), Supersonic Ring Flight, and Oa Missions!
            5. **🧬 Ben 10: Omni Evolution (Beta Addon)**
               - Custom evolution dimension, Vilgax boss animations, custom combat controllers, and alien transformations.
            6. **🛸 Omni-Bound: Faster Switching (v1.5.2)**
               - Instant quick-dial switching, 50+ alien forms, ultimate evolutions, and cinematic sound FX.
            7. **🗡️ Solo Leveling (v1.0.6 System Awakening)**
               - Sung Jinwoo's Hunter System, daily stat quests, Dagger combat, Red Gate dungeons, and Arise Shadow Soldier extraction!
            8. **🏴‍☠️ One Piece: Bedrock Edition (v76.0.0)**
               - Grand Line anime adventure! Devil Fruits, Haki mastery, Marine & Pirate factions, custom katanas (Yoru, Enma), and bosses!
            9. **🔮 Tensura: Reincarnated Requiem (v4 / 26.52)**
               - That Time I Got Reincarnated as a Slime! Great Sage mental HUD overlay, Predator skill mimicry, magicules system, Direwolves, Goblins, Charybdis and Demon Lord abilities!
            10. **🐉 Dragon Evolution (v1.5.0)**
               - Massive Dragon Evolution experience! Transform into Super Saiyan, unleash Kamehameha & Final Flash ki attacks, custom dimensions, and anime bosses!
            11. **🔫 Actual Guns 2: 3D Tactical**
                - Ultra-detailed 3D firearms! Custom recoil, first-person reload animations, sniper scopes, shotguns, assault rifles, and tactical combat!
            12. **⚡ Quirkborn: My Hero Academia (v1.515)**
                - Awaken your Quirk! One For All, Explosion, Decay, Overhaul, Half-Cold Half-Hot, fight Nomus, craft hero/villain gear, and unlock super moves!
            13. **🤖 Iron Man: Armor Wars Addon**
                - Mark 1 through 85 suits, supersonic flight, repulsors, micro-missiles, unibeam, and JARVIS HUD!
            14. **🕷️ Spider-Man: Web of Shadows Addon**
                - Fluid web slinging, wall climbing, Spider-Sense, 20+ movie suits (Symbiote, Iron Spider), and classic villain fights!
            15. **⭐ Marvel Project: Avengers Assemble (v3.0.1)**
                - Summon Mjolnir lightning, throw Cap's vibranium shield, Wolverine adamantium claws, Doctor Strange mystic portals, and the Infinity Gauntlet!
            
            ### 📥 Direct Downloads:
            - **Android Multi-Mod Installer App**: Download `app-debug.apk` and tap Install!
            - **Direct Minecraft AI Edition Addon**: Download `Minecraft_AI_Edition_v1.0.0.mcaddon` (Installs BP + RP in 1-Click!)
            - **Direct Minecraft AI Edition Resource Pack**: Download `Minecraft_AI_Edition_v1.0.0.mcpack`
            - **Direct Mythos Ascension Addon**: Download `MYTHOS_Ascension_v7_16_0.mcaddon` (Auto-opens in Minecraft!)
            - **Direct Green Lantern Addon**: Download `Green_Lantern_3_9_1.mcaddon` (Auto-opens in Minecraft!)
            - **Direct UltraReal 100x HD Texture Pack**: Download `UltraReal_100x_HD_v2.mcpack` (Auto-opens in Minecraft!)
            - **Direct Omni Evolution Addon**: Download `Omni-Evolution-Beta.mcaddon`
            - **Direct Omni Bound Addon**: Download `Omni_Bound_v1.5.2.mcaddon`
            - **Direct Solo Leveling Addon**: Download `Solo_Leveling_v1.0.6.mcaddon`
            - **Direct One Piece Addon**: Download `OnePiece_Bedrock_Edition_v76.mcaddon`
            - **Direct Tensura Requiem Addon**: Download `Tensura_Reincarnated_Requiem_v4.mcaddon`
            - **Direct Dragon Evolution Addon**: Download `Dragon_Evolution_v1.5.0.mcaddon`
            - **Direct Actual Guns 2 Addon**: Download `Actual_Guns_2.mcaddon`
            - **Direct Quirkborn Addon**: Download `Quirkborn_v1.515.3.mcaddon`
            - **Direct Iron Man Addon**: Download `Iron_Man_Addon.mcaddon`
            - **Direct Spider-Man Addon**: Download `Spider_Man_Addon.mcaddon`
            - **Direct Marvel Project Addon**: Download `Marvel_Project_v3.0.1.mcaddon`
          files: |
            apk_output/*.apk
            apk_output/*.mcaddon
            apk_output/*.mcpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
