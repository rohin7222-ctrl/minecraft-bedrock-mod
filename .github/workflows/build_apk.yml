name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "::error::Gradle build failed, dumping last 150 lines:"
            tail -n 150 build.log
            exit 1
          }

      - name: Locate APK files
        run: |
          echo "=== Found APK files ==="
          find app/build -name "*.apk" -ls || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Ben10-Mod-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Minecraft Bedrock Ben 10 Mod APK v1.0.${{ github.run_number }}
          body: |
            ## 🟢 Minecraft Bedrock Mod (Ben 10 Edition)
            - 9 Legendary Omnitrixes
            - 76 Playable Aliens & Ultimates
            - Humungousaur 60ft Titan Growth
            - Biomnitrix Dynamic 2-Alien Fusion Engine
            - Carnitrix Horror AU & Ben 23 Hero Watch
            - Auto-Bypass Android 14/15/16+ Scoped Storage (MCPEDL 1-Click Import)
            
            ### 📥 Download:
            Download the `app-debug.apk` file below and tap Install!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
