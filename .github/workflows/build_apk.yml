name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy Clean APK
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/Bedrock-Mod-Hub-v1.0.108.apk \;
          ls -la apk_output/

      - name: Upload Clean APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Mod-Hub-APK
          path: apk_output/Bedrock-Mod-Hub-v1.0.108.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Bedrock Mod Hub v1.0.${{ github.run_number }} (Cobblemon Clean Slate Foundation)
          body: |
            ## 🎮 Bedrock Mod Hub v1.0.${{ github.run_number }} (Cobblemon Clean Slate Foundation)
            - Retained all 1,252 Pokemon entities, 3D models, textures, animations, sounds, items & blocks
            - Purged 467 bloated/broken minified scripts
            - Initialized fresh, zero-lag, clean Script API main.js engine ready for custom logic
          files: |
            apk_output/Bedrock-Mod-Hub-v1.0.108.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
