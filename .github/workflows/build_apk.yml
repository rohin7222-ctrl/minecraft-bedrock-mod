name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy APK
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/ \;
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Ben10-Mod-APK
          path: apk_output/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Minecraft Bedrock Ben 10 Mod APK v1.0.${{ github.run_number }} (100 Ideas Complete)
          body: |
            ## 🟢 Minecraft Bedrock Mod (Ben 10 Edition) - 100 Solutions Complete!
            - **Classic Omnitrix Timer Lock**: Actionbar countdown timer; manual detransformation is locked (Prototype Error) and automatically reverts at 0s!
            - **Modern Omnitrixes Manual Revert**: Dedicated hotbar button & Sneak+Tap chest-dial ability to return to human form anytime!
            - **7 Custom 3D Entities**: Grandpa Max's Rust Bucket RV, Omnitrix Meteor Pod Capsule, Mutated Kevin 11 Boss, Kevin's Muscle Car, Vilgax, Vilgax Battle Cruiser, and Vilgax Chimerian Bio-Drones!
            - **9 Legendary Omnitrixes & 76 Playable Aliens**: Classic, Recalibrated, Ultimatrix, Omniverse, Biomnitrix, Ben 23, Reboot, Carnitrix, Albedo!
            - **Biomnitrix 2-Alien Fusion Engine**: Dynamic hybrid abilities!
            - **Alien Shouts, Authentic Geometries & Magma/Nanite Textures**!
            - **Auto-Bypass Android 14/15/16+ Scoped Storage (1-Click Import)**!
            
            ### 📥 Download:
            Download the `app-debug.apk` file below and tap Install!
          files: apk_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
