name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy APK and MCADDON
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/ \;
          cp app/src/main/assets/*.mcaddon apk_output/
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Bedrock-Ben10-Mod-APK
          path: |
            apk_output/*.apk
            apk_output/*.mcaddon
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Minecraft Bedrock Mod Hub v1.0.${{ github.run_number }} (Ultimate UI/UX 12-Mod Edition)
          body: |
            ## 🟢 Minecraft Bedrock Mod Hub (12 Epic Addons 1-Click Installer)
            Now includes 12 legendary Bedrock Addons with 1-Click direct Minecraft launching:
            
            1. **🏛️ Civilization: AI Villagers & Peaceful World Addon (Bedrock Edition)**
               - Features Conversational AI Villagers (no more 'hmm'!), full English dialogue, dynamic vocabulary learning system, interactive GUI menus, and complete banishment of all 35+ hostile monsters!
            2. **🧬 Ben 10: Omni Evolution (Beta Addon)**
               - Official Omni Evolution Beta Addon! Custom evolution dimension, Vilgax boss animations, custom combat controllers, and alien variants.
            3. **🛸 Omni-Bound: Faster Switching (v1.5.2)**
               - Instant quick-dial switching, 50+ alien forms, ultimate evolutions, and cinematic sound FX.
            4. **🗡️ Solo Leveling (v1.0.6 System Awakening)**
               - Sung Jinwoo's Hunter System, daily stat quests, Dagger combat, Red Gate dungeons, and Arise Shadow Soldier extraction!
            5. **🏴‍☠️ One Piece: Bedrock Edition (v76.0.0)**
               - Grand Line anime adventure! Devil Fruits, Haki mastery, Marine & Pirate factions, custom katanas (Yoru, Enma), and bosses!
            6. **🔮 Tensura: Reincarnated Requiem (v4 / 26.52)**
               - That Time I Got Reincarnated as a Slime! Great Sage mental HUD overlay, Predator skill mimicry, magicules system, Direwolves, Goblins, Charybdis and Demon Lord abilities!
            7. **🐉 Dragon Evolution (v1.5.0)**
               - Massive Dragon Evolution experience! Transform into Super Saiyan, unleash Kamehameha & Final Flash ki attacks, custom dimensions, and anime bosses!
            8. **🔫 Actual Guns 2: 3D Tactical**
               - Ultra-detailed 3D firearms! Custom recoil, first-person reload animations, sniper scopes, shotguns, assault rifles, and tactical combat!
            9. **⚡ Quirkborn: My Hero Academia (v1.515)**
               - Awaken your Quirk! One For All, Explosion, Decay, Overhaul, Half-Cold Half-Hot, fight Nomus, craft hero/villain gear, and unlock super moves!
            10. **🤖 Iron Man: Armor Wars Addon**
                - Mark 1 through 85 suits, supersonic flight, repulsors, micro-missiles, unibeam, and JARVIS HUD!
            11. **🕷️ Spider-Man: Web of Shadows Addon**
                - Fluid web slinging, wall climbing, Spider-Sense, 20+ movie suits (Symbiote, Iron Spider), and classic villain fights!
            12. **⭐ Marvel Project: Avengers Assemble (v3.0.1)**
                - Summon Mjolnir lightning, throw Cap's vibranium shield, Wolverine adamantium claws, Doctor Strange mystic portals, and the Infinity Gauntlet!
            
            ### 📥 Direct Downloads:
            - **Android Multi-Mod Installer App**: Download `app-debug.apk` and tap Install!
            - **Direct Civilization Addon**: Download `Civilization.mcaddon`
            - **Direct Omni Evolution Addon**: Download `Omni-Evolution-Beta.mcaddon`
            - **Direct Omni Bound Addon**: Download `Omni_Bound_v1.5.2.mcaddon`
            - **Direct Solo Leveling Addon**: Download `Solo_Leveling_v1.0.6.mcaddon`
            - **Direct One Piece Addon**: Download `OnePiece_Bedrock_Edition_v76.mcaddon`
            - **Direct Tensura Requiem Addon**: Download `Tensura_Reincarnated_Requiem_v4.mcaddon`
            - **Direct Dragon Evolution Addon**: Download `Dragon_Evolution_v1.5.0.mcaddon`
            - **Direct Actual Guns 2 Addon**: Download `Actual_Guns_2.mcaddon`
            - **Direct Quirkborn Addon**: Download `Quirkborn_v1.515.3.mcaddon`
            - **Direct Iron Man Addon**: Download `Iron_Man_Addon.mcaddon`
            - **Direct Spider-Man Addon**: Download `Spider_Man_Addon.mcaddon`
            - **Direct Marvel Project Addon**: Download `Marvel_Project_v3.0.1.mcaddon`
          files: |
            apk_output/*.apk
            apk_output/*.mcaddon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
