name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          if ! ./gradlew :app:assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1; then
            echo "Gradle failed. Pushing error log..."
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B build-error-log
            git add -f build_output.txt
            git commit -m "Auto-capture build error log"
            git push origin build-error-log --force
            cat build_output.txt | tail -n 120
            exit 1
          fi

      - name: Verify and Copy Clean APK
        run: |
          mkdir -p apk_output
          find app/build -name "*.apk" -exec cp {} apk_output/Bedrock-Mod-Hub-v1.0.104.apk \;
          ls -la apk_output/

      - name: Upload Clean APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Mod-Hub-APK
          path: apk_output/Bedrock-Mod-Hub-v1.0.104.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Bedrock Mod Hub v1.0.${{ github.run_number }} (Cobblemon v1.8.12 & Custom Mod Upload Edition)
          body: |
            ## 🎮 Bedrock Mod Hub v1.0.${{ github.run_number }} (Cobblemon v1.8.12 & Custom Mod Upload Edition)
            Official Bedrock Mod Hub Release! Clean single APK build without duplicate files.

            ### 🌟 What's New in v1.0.104:
            - **🏷️ Official Name: Bedrock Mod Hub**: Completely removed all Ben 10 branding and package naming.
            - **🎨 3D Bedrock Cube Logo**: Modern Netherite/Bedrock cube with glowing cyan runes and pickaxe-gear nexus.
            - **🔴 Cobblemon Bedrock (v1.8.12)**: 500+ Pokemon species, Pokeballs, Healing machine, PC Box.
            - **📤 Custom Mod Upload (`➕ Add Mod`)**: Add any `.mcaddon` or `.mcpack` from your phone!
            - **🗑️ Delete Confirmation**: Delete mods safely with confirmation popup.
            - **🧹 Storage Auto-Purge**: Auto-cleans cache 25s after import so app data never inflates.
            - **📦 Clean Single APK**: Fixed download so only `Bedrock-Mod-Hub-v1.0.104.apk` is downloaded!
          files: |
            apk_output/Bedrock-Mod-Hub-v1.0.104.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
